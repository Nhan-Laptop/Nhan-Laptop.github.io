<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{DOCUMENT_TITLE}}</title>
    {{SEO_META}}
    <link rel="preload" href="{{ROOT_PREFIX}}assets/fonts/newsreader-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ROOT_PREFIX}}assets/css/common.css">
    <link rel="stylesheet" href="{{ROOT_PREFIX}}assets/css/redesign.css">
</head>
<body class="article-page" data-topic="{{CATEGORY_SLUG}}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{{ROOT_PREFIX}}index.html" aria-label="Nhan's Security Log home">Nhan's Security Log</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Open navigation menu">
                <span class="nav-toggle-lines" aria-hidden="true"><span></span><span></span></span>
                <span class="sr-only">Menu</span>
            </button>
            <nav id="site-navigation" class="main-nav" aria-label="Primary navigation">
                <a href="{{ROOT_PREFIX}}index.html">Home</a>
                <a href="{{ROOT_PREFIX}}universe.html">Universe</a>
                <a href="{{ROOT_PREFIX}}categories/index.html">Categories</a>
                <a href="{{ROOT_PREFIX}}tags/index.html">Tags</a>
                <a href="https://github.com/Nhan-Laptop" target="_blank" rel="noopener noreferrer">GitHub</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="article-wrap">
        <section class="hero article-hero reveal is-visible">
            <nav class="breadcrumb" aria-label="Breadcrumb">
                <a href="{{ROOT_PREFIX}}index.html">Home</a>
                <span aria-hidden="true">/</span>
                <a class="topic-link" href="{{CATEGORY_HREF}}">{{CATEGORY_NAME}}</a>
                <span aria-hidden="true">/</span>
                <span aria-current="page">{{POST_TITLE}}</span>
            </nav>
            <h1>{{POST_TITLE}}</h1>
            <div class="post-meta">{{POST_META}}</div>
            <p class="lead">{{POST_SUMMARY}}</p>
        </section>

        <article id="markdownRoot" class="panel article-body reveal markdown-content is-visible">
            <h2>Article content</h2>
        </article>
    </main>

    <footer class="site-footer">
        <p>Built as an open learning log for cryptography, CTF, and security research.</p>
        <p>© <span data-current-year></span> Nguyen Trong Nhan</p>
    </footer>

    <script src="{{ROOT_PREFIX}}assets/js/common.js" defer></script>
</body>
</html>
